<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>苔石地牢 · 固定场景对照</title>
<style>html,body{margin:0;height:100%;background:#05050a;font-family:Microsoft YaHei,sans-serif;color:#e7e6e4;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}header{position:fixed;z-index:3;top:20px;left:24px;background:#111827dc;border:1px solid #495361;padding:14px 18px;border-radius:6px}h1{font-size:19px;margin:0 0 7px}p{font-size:12px;color:#a4afbe;margin:0 0 12px}a{display:inline-block;padding:7px 14px;margin-right:8px;border:1px solid #69778c;color:#e5cf9b;text-decoration:none}output{position:fixed;z-index:3;bottom:18px;left:24px;font-size:12px;color:#aab8c9}</style>
<canvas id="c"></canvas><header><h1 id="title"></h1><p>固定验收房间 · 相同地图、镜头、灯位 · 使用游戏的地形渲染器</p><a href="?version=before">原场景</a><a href="?version=after">新场景</a><a href="/weapon-lab.html">进入游戏</a></header><output id="status">正在绘制场景</output>
<script src="/vendor/voxel-world.js"></script><script src="/scene-style.js"></script><script src="/scene-assets.js"></script>
<script>
(async()=>{
  Object.defineProperty(performance,'now',{value:()=>1000});
  const before=new URLSearchParams(location.search).get('version')==='before';
  document.getElementById('title').textContent=before?'原场景 · 密集地砖与均匀墙面':'新场景 · 大石板与分层石墙';
  const script=document.createElement('script');script.src=before?'/assets/render-qa/scene-style/world3d-before.js':'/world3d.js?v=20';
  await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});
  const GW=27,GH=21,G=new Uint8Array(GW*GH),roomId=new Int16Array(G.length).fill(-1);
  for(let j=5;j<17;j++)for(let i=4;i<23;i++){G[j*GW+i]=1;roomId[j*GW+i]=0;}
  // Corridor breaks and two blocked room tiles, identical in both versions.
  for(let j=8;j<12;j++)for(let i=1;i<4;i++)G[j*GW+i]=1;
  for(let j=10;j<14;j++)for(let i=23;i<26;i++)G[j*GW+i]=1;
  const hash=(a,b,c)=>{let h=Math.imul(a,374761393)^Math.imul(b,668265263)^Math.imul(c,1274126177);h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
  const pillars=[];for(let j=8;j<14;j++)for(let i=8;i<20;i++)if(hash(i,j,31)<.2&&pillars.length<2&&(!pillars.length||i>pillars[0][0]+5)){G[j*GW+i]=0;pillars.push([i,j]);}
  const torches=[6,12,20].map((i,n)=>({i,j:4,x:i+.5,y:5.25,ph:n*.6}));
  const o={G,GW,GH,roomId,theme:{name:'苔石地牢'},torches,player:{x:13.5,y:11,G:{}},cam:{x:13.5,y:11},exitOpen:false};
  const draw=()=>{o.zoom=Math.min(innerWidth/1040,innerHeight/680)*1.22;o.ox=innerWidth/(2*o.zoom)-13.5*44;o.oy=innerHeight/(2*o.zoom)-10*32;
    const ok=World3D.frame(o);const d=World3D.diag(o.player.x,o.player.y);
    document.getElementById('status').textContent=(ok?'GPU 地形已绘制':'绘制失败')+' · '+d.meshes+' 批次 · '+d.tris+' 三角形 · 苔石地牢';};
  draw();addEventListener('resize',draw);
})();
</script></html>
